name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NcmForge.sln

      # Warnings are errors in this repository, so a warning here fails the job.
      - name: Build
        run: dotnet build NcmForge.sln -c Release --no-restore

      - name: Test
        run: dotnet test NcmForge.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # The tests must not depend on a real ffmpeg, but the diagnostics should still be shown to work
  # on a clean machine, where no ffmpeg is installed at all.
  diagnostics-without-ffmpeg:
    name: Doctor reports a missing ffmpeg cleanly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/NcmForge.Cli/NcmForge.Cli.csproj -c Release

      - name: Run doctor
        run: |
          set +e
          dotnet run --project src/NcmForge.Cli/NcmForge.Cli.csproj -c Release --no-build -- doctor
          code=$?
          # Exit code 1 simply means "no ffmpeg found"; anything else is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "doctor exited with $code"
            exit 1
          fi
          exit 0
