name: Release

# Builds and publishes NcmForge.
#
# Triggers:
#   * pushing a tag such as v1.0.0 or v1.0.0-rc2   -> that tag is the version
#   * workflow_dispatch with a bump                -> the NEXT version is computed from the existing
#                                                     tags and the tag is created for you
#
# An RC is published as a normal release, not a pre-release: this project uses release candidates as
# its primary distribution, so they carry the "latest" marker on purpose.
#
# Every artifact lands in ONE release, created by the final job from the collected artifacts. Having
# each platform job append to a shared release would race, and three jobs creating it at once can
# fail with a 422.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version to compute from the latest tag'
        type: choice
        options: [rc, patch, minor, major]
        default: rc

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Decide what version this run is building.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      is_rc: ${{ steps.v.outputs.is_rc }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag is needed to compute the next version.
          fetch-depth: 0

      - name: Compute the version
        id: v
        shell: bash
        run: |
          set -euo pipefail

          # An annotated tag needs a committer identity, and a fresh runner has none: without this
          # `git tag -a` fails with "empty ident name not allowed".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            echo "tag push: using $tag verbatim"
          else
            bump="${{ inputs.bump }}"
            # sed reads the whole stream, unlike head, which closes the pipe early and makes the
            # writer die of EPIPE - fatal under `set -o pipefail`.
            latest="$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')"
            echo "latest tag: ${latest:-<none>}"

            if [ -z "$latest" ]; then
              tag="v0.1.0-rc1"
            else
              # Strip the leading v and any pre-release suffix to get the numeric core.
              core="${latest#v}"
              core="${core%%-*}"
              major="${core%%.*}"
              rest="${core#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              : "${patch:=0}"

              case "$bump" in
                major) major=$((major + 1)); minor=0; patch=0; tag="v$major.$minor.$patch-rc1" ;;
                minor) minor=$((minor + 1)); patch=0;      tag="v$major.$minor.$patch-rc1" ;;
                patch) patch=$((patch + 1));               tag="v$major.$minor.$patch-rc1" ;;
                rc)
                  # Continue the candidate series if the latest tag already is one, otherwise start
                  # a new series one patch above the last final release.
                  if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc([0-9]+)$ ]]; then
                    n=$(( ${BASH_REMATCH[4]} + 1 ))
                    tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-rc$n"
                  else
                    tag="v$major.$minor.$((patch + 1))-rc1"
                  fi
                  ;;
                *) echo "unknown bump: $bump" >&2; exit 1 ;;
              esac
            fi

            echo "computed tag: $tag"
            git tag -a "$tag" -m "NcmForge $tag"
            git push origin "$tag"
          fi

          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "is_rc=true" >> "$GITHUB_OUTPUT" ;; *) echo "is_rc=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "building version $version"

  # ---------------------------------------------------------------------------
  # Tests gate everything.
  # ---------------------------------------------------------------------------
  test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test NcmForge.sln -c Release -p:Version=${{ needs.version.outputs.version }}

  # ---------------------------------------------------------------------------
  # One self-contained folder per platform, holding both frontends.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: [version, test]

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,    platform: win,    format: zip }
          - { os: windows-latest, rid: win-x86,    platform: win,    format: zip }
          - { os: windows-latest, rid: win-arm64,  platform: win,    format: zip }
          - { os: macos-latest,   rid: osx-x64,    platform: macos,  format: tar.gz }
          - { os: macos-latest,   rid: osx-arm64,  platform: macos,  format: tar.gz }
          - { os: ubuntu-latest,  rid: linux-x64,  platform: linux,  format: tar.gz }
          - { os: ubuntu-latest,  rid: linux-arm64, platform: linux, format: tar.gz }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Both frontends publish into the same folder so one archive carries both, and so the Linux
      # packaging step has a single tree to assemble from.
      # The two frontends MUST NOT be published into the same folder.
      #
      # The GUI builds NcmForge.exe and the CLI builds ncmforge.exe, which is the same file name on
      # Windows and on macOS's default filesystem. Publishing both into one directory therefore
      # overwrites the GUI with the CLI, and the release ships a package whose "NcmForge.exe" is a
      # console program with no window at all. They are staged apart and assembled side by side.
      - name: Publish GUI
        run: >
          dotnet publish src/NcmForge.App/NcmForge.App.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.version.outputs.version }}
          -p:DebugType=none
          -o stage

      - name: Publish CLI
        run: >
          dotnet publish src/NcmForge.Cli/NcmForge.Cli.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.version.outputs.version }}
          -p:DebugType=none
          -o stage-cli

      - name: Assemble the package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/cli
          cp -a stage-cli/. stage/cli/

          # Fail loudly rather than shipping a package with no usable window again. The GUI must be
          # at the root of the package and the CLI beside it under cli/, never in its place.
          if [ ! -f stage/cli/ncmforge ] && [ ! -f stage/cli/ncmforge.exe ]; then
            echo "the CLI binary is missing from stage/cli/" >&2
            exit 1
          fi
          if [ ! -f stage/NcmForge ] && [ ! -f stage/NcmForge.exe ]; then
            echo "the GUI binary is missing from the package root" >&2
            exit 1
          fi
          # Counts rather than `ls | head`: head exits after its quota, ls then fails with
          # "write error: Broken pipe", and pipefail turns that into a failed step.
          echo "package root: $(find stage -maxdepth 1 -type f | wc -l) files"
          echo "cli/        : $(find stage/cli -maxdepth 1 -type f | wc -l) files"
          ls stage/NcmForge* stage/ncmforge* stage/cli/ncmforge* 2>/dev/null || true

      - name: Add licence, disclaimer and notices
        shell: bash
        run: |
          set -euo pipefail
          for f in LICENSE DISCLAIMER.md THIRD-PARTY-NOTICES.md README.md; do
            [ -f "$f" ] && cp "$f" stage/ || true
          done
          mkdir -p stage/tools/ffmpeg
          cat > stage/tools/ffmpeg/README.md <<'EOF'
          # Put an ffmpeg here to support Audio Vivid
          #
          # NcmForge looks for ffmpeg in this folder BEFORE it looks on PATH.
          #
          # Mainstream ffmpeg builds cannot decode AVS3-P3 / Audio Vivid (what NetEase calls
          # immersive audio). To convert those files you need a build containing the av3a decoder.
          # Run `ncmforge doctor` and look for a line reading:  yes  av3a
          #
          # A suitable Windows build is attached to the GitHub release as
          # NcmForge-ffmpeg-av3a-win-x64.zip
          EOF

      - name: Archive (Windows)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path stage/* -DestinationPath "NcmForge-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Archive (Unix)
        if: matrix.format == 'tar.gz'
        shell: bash
        run: |
          tar -czf "NcmForge-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz" -C stage .

      - name: Upload the platform archive
        uses: actions/upload-artifact@v4
        with:
          # The release- prefix is load-bearing: the publish job selects artifacts by this pattern,
          # and downloading them all would drag the raw Linux trees (and their tools/ directory)
          # into the release assets.
          name: release-${{ matrix.rid }}
          path: NcmForge-${{ needs.version.outputs.version }}-${{ matrix.rid }}.${{ matrix.format }}
          if-no-files-found: error

      # The Linux packaging job needs the raw tree, not the archive.
      - name: Upload the Linux tree for packaging
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: tree-${{ matrix.rid }}
          path: stage
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # deb, rpm and snap, built from the published Linux tree.
  # ---------------------------------------------------------------------------
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-latest
    needs: [version, build]

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   arch: amd64 }
          - { rid: linux-arm64, arch: arm64 }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install the packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm squashfs-tools

      - name: Download the published tree
        uses: actions/download-artifact@v4
        with:
          name: tree-${{ matrix.rid }}
          path: published

      - name: Flatten the CLI for packaging
        # The tree keeps the CLI in cli/ to survive case-insensitive filesystems, but the deb, rpm
        # and snap install it as /usr/bin/ncmforge. Linux filesystems are case-sensitive, so lifting
        # it to the root here is safe.
        run: |
          set -euo pipefail
          if [ -f published/cli/ncmforge ]; then
            cp published/cli/ncmforge published/ncmforge
            chmod +x published/ncmforge
          fi
          ls -la published

      - name: Build the packages
        env:
          PUBLISHED_DIR: published
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          OUT_DIR: dist-linux
          ICON: ${{ github.workspace }}/src/NcmForge.App/Assets/ncmforge.png
          # The build job already produced the plain tarball under the rid name; letting the script
          # make its own copy means deleting it afterwards, and a half-done delete left an orphaned
          # .sha256 on the release.
          SKIP_TARBALL: '1'
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Show what was produced
        run: ls -la dist-linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}-packages
          path: dist-linux/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Source archive, so the GPL obligation is satisfiable from the release itself.
  # ---------------------------------------------------------------------------
  source:
    name: Source archive
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Create the source tarball
        run: |
          set -euo pipefail
          name="NcmForge-${{ needs.version.outputs.version }}-src"
          mkdir -p "/tmp/$name"
          # Everything tracked at this tag, minus build output that is not in the tree anyway.
          git archive --format=tar HEAD | tar -x -C "/tmp/$name"
          tar -czf "$name.tar.gz" -C /tmp "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            NcmForge-*-src.tar.gz
            NcmForge-*-src.tar.gz.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # One release, assembled from everything above.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [version, test, build, linux-packages, source]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Collect every artifact
        uses: actions/download-artifact@v4
        with:
          # Only the release-* artifacts. Downloading everything would also pull the raw Linux
          # build trees used by the packaging job, and a tool that blindly hashes the folder then
          # trips over their tools/ subdirectory.
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Optionally attach the AVS3-P3 ffmpeg
        # A 110 MB third-party GPLv3 build does not belong in git. Set the repository variable
        # FFMPEG_URL to a ready-made zip to have it attached; leave it unset and the release simply
        # ships without the bundled decoder, which only costs Audio Vivid conversion.
        #
        # scripts/upload-ffmpeg.ps1 builds that zip and can upload it directly as well.
        if: ${{ vars.FFMPEG_URL != '' }}
        run: |
          set -euo pipefail
          dest="assets/NcmForge-ffmpeg-av3a-win-x64.zip"
          echo "fetching ${{ vars.FFMPEG_URL }}"
          curl -fsSL "${{ vars.FFMPEG_URL }}" -o "$dest"
          # Refuse to publish a download that is not actually a zip.
          if ! unzip -l "$dest" >/dev/null 2>&1; then
            echo "FFMPEG_URL did not return a readable zip" >&2
            rm -f "$dest"
            exit 1
          fi
          unzip -l "$dest" | sed -n '1,20p'

      - name: Build the combined checksum list
        run: |
          set -euo pipefail
          cd assets
          rm -f SHA256SUMS SHA256SUMS.txt
          for f in *; do
            # Directories and the per-file sums are skipped: only the downloadable archives are
            # worth a line here, and a stray directory would abort the loop.
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256|SHA256SUMS*) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS
          done
          sort -o SHA256SUMS SHA256SUMS
          echo "--- assets ---"
          ls -la
          echo "--- checksums ---"
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: NcmForge ${{ needs.version.outputs.version }}
          # Deliberately a normal release even for an RC: this project ships candidates as its main
          # distribution, so they must carry the "latest" marker for the download links to resolve.
          prerelease: false
          draft: false
          generate_release_notes: true
          files: assets/*
          body: |
            ## NcmForge ${{ needs.version.outputs.version }}

            自包含发布包，**目标机器无需安装 .NET**。解压后直接运行。

            ### 下载

            | 平台 | 架构 | 文件 |
            |---|---|---|
            | Windows | x64 / x86 / ARM64 | `NcmForge-${{ needs.version.outputs.version }}-win-*.zip` |
            | macOS | Apple Silicon (arm64) | `NcmForge-${{ needs.version.outputs.version }}-osx-arm64.tar.gz` |
            | macOS | Intel (x64) | `NcmForge-${{ needs.version.outputs.version }}-osx-x64.tar.gz` |
            | Linux | x64 / arm64 | `NcmForge-${{ needs.version.outputs.version }}-linux-*.tar.gz` |
            | Linux | amd64 / arm64 | `.deb`、`.rpm`、`.snap` |

            每个 Windows / macOS 包内含图形界面（`NcmForge`）与命令行（`ncmforge`）两个程序。
            Linux 的 deb / rpm / snap 安装后会提供 `/usr/bin/ncmforge` 与 `/usr/bin/ncmforge-gui`。

            **校验**：下载后用 `SHA256SUMS` 核对完整性。

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            ### 安装 Linux 包

            ```bash
            sudo dpkg -i ncmforge_*_amd64.deb          # Debian / Ubuntu
            sudo dnf install ./ncmforge-*.x86_64.rpm   # Fedora / RHEL
            sudo snap install --dangerous ./ncmforge_*_amd64.snap
            ```

            > snap 使用 `classic` 隔离级别（需要访问任意路径下的音乐文件）。本地安装需加 `--dangerous`；
            > 从 Snap Store 安装则不需要。

            ### 关于 Audio Vivid（沉浸声 / 菁彩声）

            主流 ffmpeg 构建无法解码 AVS3-P3 / Audio Vivid，因此**默认情况下沉浸声文件会被无损提取**
            而不是转码（音频比特不变，标签与封面照常写入）。

            需要真正转码时，把一个带 `av3a` 解码器的 ffmpeg 放进程序目录的 `tools/ffmpeg/`，
            然后用 `ncmforge doctor` 确认出现 `yes  av3a`。

            ### 许可证与免责

            NcmForge 以 **GPL-3.0-or-later** 发布，源码见 `NcmForge-${{ needs.version.outputs.version }}-src.tar.gz`。
            使用前请阅读包内的 `DISCLAIMER.md`（免责声明）与 `THIRD-PARTY-NOTICES.md`（第三方组件）。
            **本软件仅用于个人对自己合法拥有的音频文件做格式转换与备份。**
